<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Nara Pustaka Internal System</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>

    *{
      font-family:'Inter',sans-serif;
      box-sizing:border-box;
    }

    body{
      margin:0;
      background:#0f172a;
      color:white;
      overflow-x:hidden;
    }

    .glass{
      background:rgba(30,41,59,.75);
      backdrop-filter:blur(14px);
      border:1px solid rgba(255,255,255,.08);
    }

    .card{
      background:linear-gradient(135deg,#1e293b,#111827);
      border-radius:24px;
      padding:16px;
      border:1px solid rgba(255,255,255,.05);
      box-shadow:0 10px 30px rgba(0,0,0,.25);
    }

    input,select,textarea{
      width:100%;
      background:#1e293b;
      border:1px solid #334155;
      color:white;
      padding:12px;
      border-radius:14px;
      margin-top:8px;
    }

    button{
      border:none;
      cursor:pointer;
      transition:.2s;
    }

    button:active{
      transform:scale(.97);
    }

    .hidden{
      display:none;
    }

    .toast{
      position:fixed;
      bottom:90px;
      left:50%;
      transform:translateX(-50%);
      background:#7c3aed;
      padding:14px 20px;
      border-radius:16px;
      z-index:999;
      box-shadow:0 10px 30px rgba(0,0,0,.4);
    }

  </style>

</head>
<body>

<div id="loginPage" class="min-h-screen flex items-center justify-center p-5">

  <div class="glass w-full max-w-sm rounded-3xl p-6">

    <h1 class="text-3xl font-bold">
      Nara Pustaka
    </h1>

    <p class="text-slate-300 text-sm mt-2">
      Internal Publishing System
    </p>

    <div class="mt-6">
      <label>Username</label>
      <input id="username" placeholder="Masukkan username">
    </div>

    <div class="mt-4">
      <label>Password</label>
      <input id="password" type="password" placeholder="Masukkan password">
    </div>

    <button onclick="login()" class="w-full bg-purple-600 py-3 rounded-2xl mt-6 font-semibold">
      Masuk
    </button>

  </div>

</div>

<div id="app" class="hidden pb-28">

  <div class="sticky top-0 z-50 glass p-4 flex items-center justify-between">

    <div>
      <h2 id="roleTitle" class="font-bold text-lg"></h2>
      <p id="userTitle" class="text-xs text-slate-300"></p>
    </div>

    <button onclick="logout()" class="bg-red-500 px-4 py-2 rounded-xl text-sm">
      Logout
    </button>

  </div>

  <div class="p-4 space-y-4">

    <div class="grid grid-cols-2 gap-3">

      <div class="card bg-gradient-to-br from-purple-600 to-indigo-700">
        <p class="text-xs opacity-80">Laba Bersih</p>
        <h2 class="text-2xl font-bold mt-2">
          Rp 0
        </h2>
      </div>

      <div class="card bg-gradient-to-br from-emerald-600 to-teal-700">
        <p class="text-xs opacity-80">Penjualan</p>
        <h2 class="text-2xl font-bold mt-2">
          0
        </h2>
      </div>

    </div>

    <div class="card">
      <canvas id="salesChart"></canvas>
    </div>

    <div id="adminSection" class="hidden">

      <div class="card">

        <div class="flex items-center justify-between">
          <h3 class="font-bold text-lg">
            Input Penjualan
          </h3>

          <button onclick="showToast('Pencarian Buku')" class="bg-slate-700 px-3 py-2 rounded-xl text-sm">
            Cari
          </button>
        </div>

        <input id="saleBook" placeholder="Judul Buku">

        <input id="saleQty" type="number" placeholder="Jumlah">

        <input id="saleTotal" type="number" placeholder="Total">

        <select id="saleMarketplace">
          <option>Shopee</option>
          <option>TikTok Shop</option>
          <option>WhatsApp</option>
        </select>

        <button onclick="saveSale()" class="w-full bg-purple-600 py-3 rounded-2xl mt-4">
          Simpan Penjualan
        </button>

        <button onclick="openDeleteModal()" class="w-full bg-red-600 py-3 rounded-2xl mt-3">
          Hapus Laporan
        </button>

      </div>

    </div>

    <div id="redaksiSection" class="hidden">

      <div class="card">

        <h3 class="font-bold text-lg">
          Input Naskah
        </h3>

        <input id="bookTitle" placeholder="Judul Buku">

        <input id="bookAuthor" placeholder="Nama Penulis">

        <input id="bookISBN" placeholder="ISBN / QRCBN">

        <input id="bookPrice" placeholder="Harga Buku">

        <button onclick="saveBook()" class="w-full bg-indigo-600 py-3 rounded-2xl mt-4">
          Simpan Buku
        </button>

      </div>

    </div>

    <div class="card">

      <div class="flex items-center justify-between">

        <h3 class="font-bold text-lg">
          Aktivitas
        </h3>

        <button onclick="exportPDF()" class="bg-purple-600 px-4 py-2 rounded-xl text-sm">
          Export PDF
        </button>

      </div>

      <div id="activityList" class="space-y-3 mt-4"></div>

    </div>

  </div>

</div>

<div class="fixed bottom-0 left-0 right-0 max-w-md mx-auto glass p-3 flex justify-around z-50">

  <button onclick="showToast('Dashboard Dibuka')">
    🏠
  </button>

  <button onclick="showToast('Laporan Dibuka')">
    📊
  </button>

  <button onclick="showToast('Penjualan Dibuka')">
    💰
  </button>

  <button onclick="showToast('Profile Dibuka')">
    👤
  </button>

</div>

<div id="toast" class="toast hidden"></div>

<div id="deleteModal" class="hidden fixed inset-0 bg-black/70 z-[999] flex items-center justify-center p-5">

  <div class="glass rounded-3xl p-5 w-full max-w-sm">

    <h3 class="font-bold text-lg">
      Hapus Data?
    </h3>

    <p class="text-sm text-slate-300 mt-2">
      Apakah anda yakin ingin menghapus laporan ini?
    </p>

    <div class="grid grid-cols-2 gap-3 mt-5">

      <button onclick="closeDeleteModal()" class="bg-slate-700 py-3 rounded-2xl">
        Batal
      </button>

      <button onclick="confirmDelete()" class="bg-red-600 py-3 rounded-2xl">
        Hapus
      </button>

    </div>

  </div>

</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbzvSNto-MQycc_rqZBv_AnxQsdSlNvdAlogJvNZTjO-4QVdihm3M_RCm9hRQ4zxo0tD/exec";

const USERS = [
  {username:"vero",password:"vero123",role:"Manager"},
  {username:"jeyraa",password:"jey123",role:"Leader"},
  {username:"thami",password:"thami123",role:"Admin"},
  {username:"elyna",password:"elyna123",role:"Redaksi"},
  {username:"nala",password:"nala123",role:"Designer"},
  {username:"calista",password:"calista123",role:"Illustrator"},
  {username:"zahra",password:"zahra123",role:"Illustrator"}
];

let currentUser = null;

function login(){

  const username = document.getElementById('username').value;
  const password = document.getElementById('password').value;

  const user = USERS.find(
    u=>u.username===username && u.password===password
  );

  if(!user){
    alert('Login gagal');
    return;
  }

  currentUser = user;

  localStorage.setItem(
    'naraUser',
    JSON.stringify(user)
  );

  document.getElementById('loginPage').classList.add('hidden');

  document.getElementById('app').classList.remove('hidden');

  document.getElementById('roleTitle').innerText = user.role;

  document.getElementById('userTitle').innerText = user.username;

  if(user.role === 'Admin'){
    document.getElementById('adminSection').classList.remove('hidden');
  }

  if(user.role === 'Redaksi'){
    document.getElementById('redaksiSection').classList.remove('hidden');
  }

  addActivity('Login berhasil');

}

function logout(){

  localStorage.removeItem('naraUser');

  location.reload();

}

window.onload = ()=>{

  const saved = localStorage.getItem('naraUser');

  if(saved){

    currentUser = JSON.parse(saved);

    document.getElementById('loginPage').classList.add('hidden');

    document.getElementById('app').classList.remove('hidden');

    document.getElementById('roleTitle').innerText = currentUser.role;

    document.getElementById('userTitle').innerText = currentUser.username;

    if(currentUser.role === 'Admin'){
      document.getElementById('adminSection').classList.remove('hidden');
    }

    if(currentUser.role === 'Redaksi'){
      document.getElementById('redaksiSection').classList.remove('hidden');
    }

  }

  renderChart();

}

function renderChart(){

  new Chart(
    document.getElementById('salesChart'),
    {
      type:'line',
      data:{
        labels:['Sen','Sel','Rab','Kam','Jum'],
        datasets:[
          {
            label:'Penjualan',
            data:[12,19,3,5,9]
          }
        ]
      }
    }
  )

}

async function saveSale(){

  const data = {
    type:'sale',
    id:'SALE-'+Date.now(),
    invoice_number:'INV-'+Date.now(),
    book:document.getElementById('saleBook').value,
    qty:document.getElementById('saleQty').value,
    total:document.getElementById('saleTotal').value,
    marketplace:document.getElementById('saleMarketplace').value,
    payment_status:'Paid',
    invoice_file:'-',
    payment_proof:'-',
    date:new Date().toLocaleDateString(),
    user:currentUser.username
  }

  await fetch(API_URL,{
    method:'POST',
    body:JSON.stringify(data)
  })

  addActivity('Penjualan berhasil disimpan');

  showToast('Penjualan berhasil disimpan');

}

async function saveBook(){

  const data = {
    type:'book',
    id:'BOOK-'+Date.now(),
    title:document.getElementById('bookTitle').value,
    author:document.getElementById('bookAuthor').value,
    isbn:document.getElementById('bookISBN').value,
    qrcbn:'-',
    price:document.getElementById('bookPrice').value,
    royalty_percent:'10%',
    status:'Aktif',
    contract_end:'-',
    created_at:new Date().toLocaleDateString()
  }

  await fetch(API_URL,{
    method:'POST',
    body:JSON.stringify(data)
  })

  addActivity('Buku berhasil disimpan');

  showToast('Buku berhasil disimpan');

}

function exportPDF(){

  showToast('PDF berhasil dibuat');

}

function showToast(message){

  const toast = document.getElementById('toast');

  toast.innerText = message;

  toast.classList.remove('hidden');

  setTimeout(()=>{
    toast.classList.add('hidden');
  },2500)

}

function openDeleteModal(){

  document.getElementById('deleteModal').classList.remove('hidden');

}

function closeDeleteModal(){

  document.getElementById('deleteModal').classList.add('hidden');

}

function confirmDelete(){

  closeDeleteModal();

  showToast('Data berhasil dihapus');

}

function addActivity(text){

  const item = document.createElement('div');

  item.className = 'bg-slate-800 rounded-2xl p-3';

  item.innerHTML = `
    <p class="font-medium">${text}</p>
    <p class="text-xs text-slate-400 mt-1">
      ${new Date().toLocaleString()}
    </p>
  `;

  document.getElementById('activityList').prepend(item);

}

</script>

</body>
</html>
