<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nara Pustaka - TalentaSync Dashboard</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/js/all.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght=300;400;500;600;700;900&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { nara: { botol: '#064E3B', cokelat: '#8B5A2B', krem: '#DBC2A1', bg: '#FDFBF7' } }
                }
            }
        }
    </script>
    <style>
        body { background-color: #FDFBF7; }
        .fade { animation: fade 0.2s ease-out; }
        @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    </style>
</head>
<body class="text-[#1E1E1E] antialiased min-h-screen">

<div id="app"></div>

<script>
// Masukkan URL Web App Google Apps Script Anda yang aktif di bawah ini
const API_URL = 'https://script.google.com/macros/s/AKfycbyBbOFVU5xwqZr0q5zhb4Q76x0f8x8u44SbT-tVdj6GtVTbwqGekiEigCYils9WUUJs/exec';

// Konfigurasi Hak Akses & Kredensial Pengguna Resmi Nara Pustaka
const USERS = [
    {username:'vero',password:'vero123',role:'Manager',fullname:'Deby Verona'},
    {username:'jeyraa',password:'jey123',role:'Team Leader',fullname:'Jeyraa'},
    {username:'thami',password:'thami123',role:'Administrasi',fullname:'Thami'},
    {username:'elyna',password:'ely123',role:'Redaksi',fullname:'Elyna'},
    {username:'nala',password:'nala123',role:'Desain',fullname:'Nala'},
    {username:'calista',password:'calista123',role:'Kreatif',fullname:'Calista'},
    {username:'zahra',password:'zahra123',role:'Kreatif',fullname:'Zahra'}
];

let books = [], sales = [], projects = [], expenses = [], attendanceLog = [];
let isSidebarOpen = false;

init();

function init() {
    const user = JSON.parse(localStorage.getItem('naraUser'));
    if (user) { loadAllData(user); } else { loginPage(); }
}

function toast(msg) {
    const div = document.createElement('div');
    div.className = 'fixed top-5 left-1/2 -translate-x-1/2 bg-nara-botol text-white px-5 py-3 rounded-xl shadow-2xl z-50 font-medium text-xs border border-emerald-500 fade';
    div.innerText = msg;
    document.body.appendChild(div);
    setTimeout(() => div.remove(), 2200);
}

function toggleSidebar() {
    isSidebarOpen = !isSidebarOpen;
    const sidebar = document.getElementById('sidebarMenu');
    if (sidebar) {
        if (isSidebarOpen) { sidebar.classList.remove('-translate-x-full'); } 
        else { sidebar.classList.add('-translate-x-full'); }
    }
}

function loginPage() {
    document.getElementById('app').innerHTML = `
    <div class="min-h-screen flex items-center justify-center p-4 fade">
        <div class="bg-white rounded-3xl w-full max-w-sm shadow-xl border border-gray-100 p-6 space-y-6">
            <div class="text-center">
                <div class="flex justify-center mb-3">
                    <div class="w-11 h-11 bg-nara-botol transform -skew-x-12 rounded-xl flex items-center justify-center shadow">
                        <span class="text-white font-black text-xl transform skew-x-12">N</span>
                    </div>
                </div>
                <h1 class="text-xl font-black text-gray-900 tracking-tight">Nara Pustaka</h1>
                <p class="text-xs font-semibold text-gray-400 mt-0.5">TalentaSync Client-Engine v3.5</p>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="text-[10px] font-bold text-gray-400 uppercase tracking-wider block mb-1.5">Username</label>
                    <div class="relative flex items-center">
                        <i class="fa fa-user absolute left-4 text-gray-300 text-xs"></i>
                        <input id="username" type="text" placeholder="Masukkan username" class="w-full pl-10 pr-4 py-3 text-xs rounded-xl border border-gray-200 bg-gray-50/50 font-medium focus:outline-none focus:border-nara-botol">
                    </div>
                </div>
                <div>
                    <label class="text-[10px] font-bold text-gray-400 uppercase tracking-wider block mb-1.5">Password</label>
                    <div class="relative flex items-center">
                        <i class="fa fa-lock absolute left-4 text-gray-300 text-xs"></i>
                        <input id="password" type="password" placeholder="••••••••" class="w-full pl-10 pr-4 py-3 text-xs rounded-xl border border-gray-200 bg-gray-50/50 font-medium focus:outline-none focus:border-nara-botol">
                    </div>
                </div>
            </div>
            <button onclick="login()" class="w-full bg-nara-botol hover:bg-emerald-900 text-white py-3 rounded-xl font-bold text-xs tracking-wide transition shadow-md flex items-center justify-center space-x-2">
                <span>Masuk Sistem</span>
                <i class="fa fa-arrow-right text-[10px] opacity-80"></i>
            </button>
        </div>
    </div>`;
}

async function login() {
    const u = document.getElementById('username').value.trim();
    const p = document.getElementById('password').value.trim();
    const found = USERS.find(x => x.username === u && x.password === p);
    if (!found) { toast('Akses ditolak! Kredensial salah.'); return; }
    localStorage.setItem('naraUser', JSON.stringify(found));
    await loadAllData(found);
}

function logout() {
    localStorage.removeItem('naraUser');
    loginPage();
}

async function loadAllData(user) {
    document.getElementById('app').innerHTML = `
    <div class="min-h-screen flex items-center justify-center bg-nara-bg">
        <div class="text-center space-y-2">
            <div class="w-10 h-10 border-4 border-nara-botol border-t-transparent rounded-full animate-spin mx-auto"></div>
            <div class="text-xs font-bold text-nara-botol">Sinkronisasi Basis Data Awan...</div>
        </div>
    </div>`;

    try {
        const [b, s, p, e, a] = await Promise.all([
            fetch(API_URL + '?action=getBooks').then(r => r.json().catch(()=>[])),
            fetch(API_URL + '?action=getSales').then(r => r.json().catch(()=>[])),
            fetch(API_URL + '?action=getProjects').then(r => r.json().catch(()=>[])),
            fetch(API_URL + '?action=getExpenses').then(r => r.json().catch(()=>[])),
            fetch(API_URL + '?action=getAttendance').then(r => r.json().catch(()=>[]))
        ]);

        books = b; sales = s; projects = p; expenses = e; attendanceLog = a;
        isSidebarOpen = false;
        renderResponsiveDashboard(user);
    } catch (err) {
        console.error(err);
        toast('Gagal memuat basis data awan!');
    }
}

function renderResponsiveDashboard(user) {
    let contentUI = '';
    if(user.role === 'Manager') contentUI = getManagerUI();
    else if(user.role === 'Administrasi') contentUI = getAdminUI(user);
    else if(user.role === 'Redaksi') contentUI = getRedaksiUI();
    else if(user.role === 'Desain') contentUI = getDesainUI();
    else if(user.role === 'Team Leader') contentUI = getLeaderUI();
    else if(user.role === 'Kreatif') contentUI = getCreativeUI();

    document.getElementById('app').innerHTML = `
    <div class="flex min-h-screen bg-nara-bg relative overflow-x-hidden">
        
        <aside id="sidebarMenu" class="fixed lg:sticky top-0 left-0 z-50 flex flex-col w-64 bg-nara-botol text-white p-5 justify-between h-screen shrink-0 transform -translate-x-full lg:translate-x-0 transition-transform duration-200 ease-in-out shadow-xl lg:shadow-none">
            <div class="space-y-6">
                <div class="flex items-center justify-between font-black text-lg tracking-tight">
                    <div class="flex items-center space-x-2">
                        <div class="w-5 h-5 bg-emerald-400 transform -skew-x-12 rounded-sm"></div>
                        <span>TalentaSync</span>
                    </div>
                    <button onclick="toggleSidebar()" class="lg:hidden text-white text-sm"><i class="fa fa-times"></i></button>
                </div>
                <nav class="space-y-1">
                    <a href="#" class="flex items-center space-x-3 bg-emerald-900/50 px-4 py-2.5 rounded-xl font-medium text-xs text-white">
                        <i class="fa fa-layer-group w-4 text-emerald-400"></i>
                        <span>${user.role} Workspace</span>
                    </a>
                </nav>
            </div>
            
            <div class="border-t border-emerald-800 pt-4 flex items-center justify-between">
                <div class="flex items-center space-x-2.5 min-w-0">
                    <div class="w-8 h-8 rounded-full bg-emerald-700 flex items-center justify-center font-bold text-[11px] border border-emerald-400 shrink-0">
                        ${user.fullname.substring(0,2)}
                    </div>
                    <div class="truncate text-left">
                        <p class="font-bold text-xs truncate max-w-[120px]">${user.fullname}</p>
                        <p class="text-[10px] text-emerald-300 mt-0.5 truncate">${user.role}</p>
                    </div>
                </div>
                <button onclick="logout()" class="text-red-300 hover:text-red-400 p-1.5 text-xs"><i class="fa fa-power-off"></i></button>
            </div>
        </aside>

        <div class="flex-1 min-w-0 flex flex-col min-h-screen">
            <header class="bg-white border-b border-gray-100 px-4 py-3 flex items-center justify-between sticky top-0 z-40">
                <div class="flex items-center space-x-3">
                    <button onclick="toggleSidebar()" class="lg:hidden text-nara-botol text-base p-1"><i class="fa fa-bars"></i></button>
                    <div class="hidden sm:block text-left">
                        <p class="text-[10px] text-gray-400 font-bold uppercase tracking-wider">Lini Operasional</p>
                        <p class="text-xs font-bold text-gray-700">Nara Pustaka Core Network</p>
                    </div>
                </div>
                <div class="flex space-x-2">
                    <button onclick="init()" class="bg-nara-bg border border-gray-200 px-3 py-1.5 rounded-xl text-xs font-bold text-nara-botol hover:bg-gray-100 transition"><i class="fa fa-sync-alt mr-1"></i> Refresh</button>
                </div>
            </header>

            <main class="flex-1 p-4 md:p-8 max-w-6xl w-full mx-auto fade">
                <div class="mb-6">
                    <h1 class="text-2xl font-black text-gray-800 tracking-tight">Halo, ${user.fullname}</h1>
                    <p class="text-xs text-gray-400 mt-0.5">Sistem kendali data terpusat berbasis Client-Side Processing.</p>
                </div>

                <div class="bg-white p-4 rounded-2xl border border-gray-100 shadow-sm mb-6 flex flex-col md:flex-row items-center justify-between gap-4">
                    <div class="flex items-center space-x-3 w-full md:w-auto">
                        <div class="w-9 h-9 bg-emerald-50 rounded-xl flex items-center justify-center text-nara-botol shrink-0"><i class="fa fa-fingerprint text-base"></i></div>
                        <div>
                            <h4 class="font-bold text-xs text-gray-800">Presensi Karyawan Terintegrasi</h4>
                            <p class="text-[10px] text-gray-400">Pencatatan langsung terhubung ke database awan korporat.</p>
                        </div>
                    </div>
                    <div class="flex space-x-2 w-full md:w-auto justify-end">
                        <button onclick="handleAttendance('Masuk')" class="flex-1 md:flex-none bg-nara-botol text-white px-4 py-2 rounded-xl text-xs font-bold hover:bg-emerald-950 transition"><i class="fa fa-sign-in-alt mr-1"></i> Clock In</button>
                        <button onclick="handleAttendance('Pulang')" class="flex-1 md:flex-none bg-orange-600 text-white px-4 py-2 rounded-xl text-xs font-bold hover:bg-orange-700 transition"><i class="fa fa-sign-out-alt mr-1"></i> Clock Out</button>
                    </div>
                </div>

                ${contentUI}
            </main>
        </div>
    </div>`;

    if(user.role === 'Manager') renderManagerChart();
}

async function handleAttendance(type) {
    const user = JSON.parse(localStorage.getItem('naraUser'));
    const now = new Date();
    const dateStr = now.toLocaleDateString('id-ID');
    const timeStr = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });

    toast(`Mencatatkan absensi ${type}...`);
    try {
        await fetch(API_URL, {
            method: 'POST',
            body: JSON.stringify({
                action: 'addRow',
                data: {
                    sheet: 'Attendance',
                    rowData: { id: String(Date.now()), name: user.fullname, role: user.role, date: dateStr, time: timeStr, type: type }
                }
            })
        });
        toast(`Absen ${type} sukses pada pukul ${timeStr}!`);
        loadAllData(user);
    } catch(err) {
        toast('Koneksi sibuk! Gagal mengirim absensi.');
    }
}

function getManagerUI() {
    const income = sales.reduce((a,b)=>a+Number(b.total||0),0);
    const outcome = expenses.reduce((a,b)=>a+Number(b.amount||0),0);
    const profit = income - outcome;

    return `
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
        <div class="bg-white p-5 rounded-2xl border border-gray-100 shadow-xs">
            <span class="text-[10px] font-bold text-emerald-700 bg-emerald-50 px-2.5 py-0.5 rounded-full">Total Omzet</span>

        </div>
        <div class="bg-white p-5 rounded-2xl border border-gray-100 shadow-xs">
            <span class="text-[10px] font-bold text-red-600 bg-red-50 px-2.5 py-0.5 rounded-full">Biaya Operasional</span>
            <h3 class="text-xl font-black mt-3">Rp ${outcome.toLocaleString()}</h3>
        </div>
        <div class="bg-white p-5 rounded-2xl border border-gray-100 shadow-xs flex flex-col justify-between">

                <span class="text-[10px] font-bold text-nara-botol bg-emerald-100 px-2.5 py-0.5 rounded-full">Net Profit</span>
                <button onclick="exportManagerPDF()" class="text-[10px] font-bold bg-nara-botol text-white px-2.5 py-1 rounded-lg"><i class="fa fa-print mr-1"></i> Cetak</button>
            </div>
            <h3 class="text-xl font-black text-emerald-600 mt-3">Rp ${profit.toLocaleString()}</h3>
        </div>
    </div>
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <div class="bg-white p-5 rounded-2xl border border-gray-100 shadow-xs lg:col-span-2">
            <h2 class="font-bold text-gray-500 mb-4 text-[10px] uppercase tracking-wider">Performa Distribusi Lini Buku</h2>
            <div class="h-64 w-full relative"><canvas id="salesChart"></canvas></div>
        </div>
        <div class="bg-white p-5 rounded-2xl border border-gray-100 shadow-xs flex flex-col justify-between">
            <div>
                <div class="flex justify-between items-center border-b pb-2 mb-3">
                    <h2 class="font-bold text-gray-500 text-[10px] uppercase tracking-wider">Log Kehadiran Tim</h2>
                    <button onclick="clearAllData('Attendance')" class="text-[9px] text-red-500 hover:underline font-bold"><i class="fa fa-trash-alt mr-1"></i> Bersihkan Log</button>
                </div>
                <div class="space-y-2 max-h-52 overflow-y-auto pr-1">
                    ${attendanceLog.length === 0 ? '<p class="text-center text-xs text-gray-400 py-10">Belum ada absen masuk.</p>':''}
                    ${attendanceLog.slice().reverse().map(log => `

                            <div class="font-bold text-gray-800">${log.name || '-'}</div>

                        </div>

                            <span class="px-2 py-0.5 rounded-full font-bold text-[9px] ${log.type === 'Masuk' ? 'bg-emerald-50 text-emerald-700' : 'bg-orange-50 text-orange-700'}">${log.type || '-'}</span>
                            <button onclick="deleteData('Attendance', '${log.id}')" class="text-red-400 hover:text-red-600 p-1"><i class="fa fa-trash text-[10px]"></i></button>
                        </div>
                    </div>`).join('')}
                </div>
            </div>
        </div>
    </div>`;

                <div class="flex justify-between"><span>Omzet:</span><input id="total" readonly value="Rp 0" class="font-bold bg-transparent text-right outline-none w-28"></div>

}

function calculateTotal() {
    const title = document.getElementById('book').value;
    const book = books.find(x => x.title === title);
    const qty = Number(document.getElementById('qty').value || 0);
    if (!book) return;
    const total = qty * Number(book.price || 0);
    const royal = total * (Number(book.royalty_percent || 0) / 100);
    document.getElementById('total').value = 'Rp ' + total.toLocaleString();
    document.getElementById('royaltyAmount').value = 'Rp ' + royal.toLocaleString();
}

async function saveSale(user) {
    const title = document.getElementById('book').value;
    const book = books.find(x => x.title === title);
    if (!book) { toast('Pilih judul buku!'); return; }
    const qty = Number(document.getElementById('qty').value || 0);
    if (qty <= 0) { toast('Kuantitas minimal 1 unit!'); return; }
    
    const total = qty * Number(book.price || 0);
    const royal = total * (Number(book.royalty_percent || 0) / 100);
    const generatedId = String(Date.now());

    toast('Menyimpan transaksi...');
    await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({
            action: 'addRow',
            data: {
                sheet: 'Sales',
                rowData: { id: generatedId, date: new Date().toLocaleDateString('id-ID'), buyer_name: document.getElementById('buyer').value || '-', book: title, author: book.author || '-', qty: qty, total: total, royalty: royal, marketplace: document.getElementById('marketplace').value || '-', payment_status: 'Paid', invoice_file: '-', payment_file: '-', user: user }
            }
        })
    });
    toast('Data penjualan sukses disimpan!');
    loadAllData(JSON.parse(localStorage.getItem('naraUser')));
}

async function saveExpense(user) {
    const desc = document.getElementById('expenseDescription').value.trim();
    const amount = Number(document.getElementById('expenseAmount').value || 0);
    if(!desc || amount <= 0) { toast('Data pengeluaran tidak valid!'); return; }
    
    toast('Menyimpan pengeluaran...');
    await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({
            action: 'addRow',
            data: {
                sheet: 'Expenses',
                rowData: { id: String(Date.now()), description: desc, category: 'Percetakan', vendor: document.getElementById('vendor').value || '-', amount: amount, receipt_file: '-', date: new Date().toLocaleDateString('id-ID'), user: user }
            }
        })
    });
    toast('Data biaya operasional tersimpan!');
    loadAllData(JSON.parse(localStorage.getItem('naraUser')));
}

async function saveProject() {
    const titleVal = document.getElementById('title').value.trim();
    if(!titleVal) { toast('Judul wajib diisi!'); return; }
    const generatedId = String(Date.now());

    toast('Mendaftarkan judul naskah...');
    await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({
            action: 'addRow',
            data: {
                sheet: 'Projects',
                rowData: { id: generatedId, projectId: generatedId, title: titleVal, author: document.getElementById('author').value || '-', status: document.getElementById('status').value, redaksi: 'Elyna', editor: document.getElementById('editor').value || '-', layout: document.getElementById('layout').value || '-', cover: document.getElementById('cover').value || '-' }
            }
        })
    });
    
    await fetch(API_URL, {

                sheet: 'Books',
                rowData: { id: 'BK' + generatedId, title: titleVal, author: document.getElementById('author').value || '-', isbn: document.getElementById('isbn').value || '-', price: document.getElementById('price').value || 0, royalty_percent: document.getElementById('royalty').value || 0, status: document.getElementById('status').value }
            }
        })
    });
    
    toast('Buku resmi terdaftar di sistem!');
    loadAllData(JSON.parse(localStorage.getItem('naraUser')));
}

async function deleteData(sheetName, id) {
    if (!id || id === 'undefined') {
        toast('ID tidak valid. Gagal memproses data.');
        return;
    }
    if (!confirm(`Hapus item ini secara permanen dari tabel '${sheetName}'?`)) return;
    
    toast('Menghapus data...');
    try {
        const res = await fetch(API_URL, {
            method: 'POST',
            body: JSON.stringify({
                action: 'deleteRow',
                data: { sheet: sheetName, id: String(id) }
            })
        }).then(r => r.json());
        
        if(res.status === 'Success') {
            toast('Item berhasil dihapus!');
        } else {
            toast('Item tidak ditemukan di server spreadsheet.');
        }
        loadAllData(JSON.parse(localStorage.getItem('naraUser')));
    } catch(err) {
        toast('Gagal terhubung dengan server.');
    }
}

async function clearAllData(sheetName) {
    if (!confirm(`PERINGATAN OPERASIONAL:\nAnda akan mengosongkan seluruh data pada tabel "${sheetName}".`)) return;
    if (!confirm('Apakah Anda benar-benar yakin? Tindakan ini bersifat permanen.')) return;

    toast(`Mengosongkan tabel ${sheetName}...`);
    try {
        await fetch(API_URL, {
            method: 'POST',
            body: JSON.stringify({
                action: 'deleteAllRows',
                data: { sheet: sheetName }
            })
        });
        toast(`Tabel ${sheetName} kini kosong.`);
        loadAllData(JSON.parse(localStorage.getItem('naraUser')));
    } catch(err) {
        toast('Gagal membersihkan database.');
    }
}

function drawNaraLogo(doc, x, y) {
    doc.setFillColor(139, 90, 43); doc.rect(x, y + 2, 4, 18, 'F'); doc.rect(x + 14, y + 5, 4, 15, 'F');
    for(let i=0; i<=10; i++) {
        let pct = i / 10; let arcY = y + 5 - Math.sin(pct * Math.PI) * 3; doc.rect(x + 4 + (pct * 10), arcY, 1.5, 5, 'F');
    }
    doc.setFillColor(219, 194, 161); doc.circle(x + 2, y + 18, 3, 'F'); doc.setFillColor(139, 90, 43); doc.circle(x + 2, y + 18, 1.2, 'F');
}

function drawDebySignature(doc, x, y) {
    doc.setDrawColor(40, 40, 40); doc.setLineWidth(0.6); doc.ellipse(x + 12, y + 2, 12, 3, 'D');
    doc.line(x + 18, y + 4, x + 16, y + 8); doc.line(x + 16, y + 8, x + 20, y + 10); doc.line(x + 20, y + 10, x + 15, y + 13); doc.line(x + 15, y + 13, x + 19, y + 16); doc.ellipse(x + 10, y + 17, 10, 2, 'D');
    for (let theta = 0; theta <= Math.PI; theta += 0.1) {
        let xStart = x + 13 - Math.cos(theta) * 11; let yStart = y + 28 - Math.sin(theta) * 10;
        let xEnd = x + 13 - Math.cos(theta + 0.1) * 11; let yEnd = y + 28 - Math.sin(theta + 0.1) * 10;
        if(theta + 0.1 <= Math.PI) doc.line(xStart, yStart, xEnd, yEnd);
    }
    doc.line(x + 2, y + 28, x + 26, y + 28); doc.line(x + 23, y + 25, x + 25, y + 29);
}
