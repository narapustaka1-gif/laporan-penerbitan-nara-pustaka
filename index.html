<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nara Pustaka OS | Enterprise v2.1</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>

    <style>
        :root {
            --primary: #6366f1; --bg: #f8fafc; --dark: #0f172a;
            --glass: rgba(255, 255, 255, 0.9); --border: rgba(226, 232, 240, 0.8);
            --success: #22c55e; --danger: #ef4444;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg); color: var(--dark); overflow-x: hidden; }

        .hidden { display: none !important; }
        .fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* --- AUTH SCREEN --- */
        .auth-screen { height: 100vh; display: flex; justify-content: center; align-items: center; background: radial-gradient(circle at 0% 0%, #e0e7ff 0%, #f8fafc 100%); }
        .login-box { padding: 40px; border-radius: 30px; width: 90%; max-width: 400px; text-align: center; background: white; box-shadow: 0 20px 40px rgba(0,0,0,0.05); border: 1px solid var(--border); }
        .brand { font-size: 28px; font-weight: 800; margin-bottom: 25px; letter-spacing: -1px; }
        .brand span { color: var(--primary); }

        .input-group { text-align: left; margin-bottom: 15px; }
        .input-group label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 5px; color: #64748b; }
        .input-group input, .input-group select { width: 100%; padding: 12px 15px; border-radius: 12px; border: 1px solid #e2e8f0; outline: none; }

        #btn-login { width: 100%; padding: 15px; border-radius: 12px; border: none; background: var(--dark); color: white; font-weight: 700; cursor: pointer; margin-top: 10px; }

        /* --- LAYOUT --- */
        .sidebar { width: 260px; height: 100vh; position: fixed; left: 0; top: 0; padding: 30px; background: white; border-right: 1px solid #e2e8f0; z-index: 100; }
        .main-content { margin-left: 260px; padding: 40px; min-height: 100vh; }
        
        .nav-item { padding: 12px 15px; border-radius: 12px; margin-bottom: 5px; cursor: pointer; color: #64748b; font-weight: 600; display: flex; align-items: center; gap: 10px; transition: 0.2s; }
        .nav-item.active { background: var(--primary); color: white; }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .card-stat { padding: 20px; border-radius: 20px; background: white; border: 1px solid #e2e8f0; }

        /* MOBILE */
        @media (max-width: 768px) {
            .sidebar { display: none; }
            .main-content { margin-left: 0; padding: 20px 20px 100px 20px; }
            .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; height: 70px; background: white; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #e2e8f0; z-index: 1000; }
        }
    </style>
</head>
<body>

    <!-- LOADING OVERLAY -->
    <div id="loader" style="position:fixed; inset:0; background:white; z-index:9999; display:flex; justify-content:center; align-items:center;">
        <div class="brand">NARA<span>PUSTAKA</span></div>
    </div>

    <!-- LOGIN PAGE -->
    <section id="page-login" class="auth-screen hidden">
        <div class="login-box fade-in">
            <div class="brand">NARA<span>PUSTAKA</span></div>
            <div class="input-group">
                <label>User Role</label>
                <select id="role-in">
                    <option value="Manager">Manager</option>
                    <option value="Editor">Editor (Elyna)</option>
                    <option value="Admin">Admin (Thami)</option>
                </select>
            </div>
            <div class="input-group">
                <label>Passcode</label>
                <input type="password" id="pass-in" value="admin123">
            </div>
            <button id="btn-login" onclick="login()">Buka Sistem</button>
        </div>
    </section>

    <!-- DASHBOARD PAGE -->
    <section id="page-app" class="hidden">
        <aside class="sidebar">
            <div class="brand" style="font-size: 20px;">NARA<span>PUSTAKA</span></div>
            <div class="nav-item active" onclick="switchTab('dash')" id="nav-dash"><i class="fa-solid fa-house"></i> Dashboard</div>
            <div class="nav-item" onclick="switchTab('books')" id="nav-books"><i class="fa-solid fa-book"></i> Naskah</div>
            <div class="nav-item" onclick="switchTab('finance')" id="nav-finance"><i class="fa-solid fa-wallet"></i> Keuangan</div>
            <div class="nav-item" onclick="logout()" style="color: var(--danger); margin-top: 20px;"><i class="fa-solid fa-power-off"></i> Logout</div>
        </aside>

        <main class="main-content">
            <header class="header">
                <div>
                    <h1 id="title-text">Dashboard</h1>
                    <p id="user-tag" style="color: #64748b; font-size: 14px;"></p>
                </div>
            </header>

            <div id="content-dash" class="tab-content fade-in">
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px;">
                    <div class="card-stat">
                        <small>Total Omzet</small>
                        <h2 id="val-rev">Rp 0</h2>
                    </div>
                    <div class="card-stat">
                        <small>Buku Terbit</small>
                        <h2 id="val-books">0</h2>
                    </div>
                </div>
                <div style="margin-top: 30px; background: white; padding: 25px; border-radius: 20px; border: 1px solid #e2e8f0;">
                    <h3>Aktivitas Terbaru</h3>
                    <p style="color: #94a3b8; margin-top: 10px;">Menunggu data dari Spreadsheet...</p>
                </div>
            </div>

            <div id="content-books" class="tab-content hidden fade-in">
                <h2>Manajemen Naskah</h2>
                <p>Daftar naskah yang sedang diproses.</p>
            </div>

            <div id="content-finance" class="tab-content hidden fade-in">
                <h2>Laporan Keuangan</h2>
                <p>Data kas masuk dan keluar.</p>
            </div>
        </main>

        <nav class="bottom-nav">
            <div onclick="switchTab('dash')"><i class="fa-solid fa-house"></i></div>
            <div onclick="switchTab('books')"><i class="fa-solid fa-book"></i></div>
            <div onclick="switchTab('finance')"><i class="fa-solid fa-wallet"></i></div>
        </nav>
    </section>

    <script>
        // --- LOGIC UTAMA ---
        const ui = {
            loader: document.getElementById('loader'),
            loginPage: document.getElementById('page-login'),
            appPage: document.getElementById('page-app')
        };

        window.onload = () => {
            checkSession();
            setTimeout(() => { ui.loader.classList.add('hidden'); }, 1000);
        };

        function login() {
            const role = document.getElementById('role-in').value;
            // Simpan ke memori browser
            localStorage.setItem('nara_session', 'active');
            localStorage.setItem('nara_role', role);
            localStorage.setItem('nara_tab', 'dash');
            
            location.reload(); // Refresh untuk menerapkan status
        }

        function checkSession() {
            const session = localStorage.getItem('nara_session');
            const savedTab = localStorage.getItem('nara_tab') || 'dash';
            const role = localStorage.getItem('nara_role');

            if (session === 'active') {
                ui.loginPage.classList.add('hidden');
                ui.appPage.classList.remove('hidden');
                document.getElementById('user-tag').innerText = "Logged in as: " + role;
                switchTab(savedTab); // Kembali ke tab terakhir sebelum refresh
            } else {
                ui.loginPage.classList.remove('hidden');
                ui.appPage.classList.add('hidden');
            }
        }

        function switchTab(tabId) {
            // Sembunyikan semua konten
            document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));

            // Tampilkan yang dipilih
            document.getElementById('content-' + tabId).classList.remove('hidden');
            document.getElementById('nav-' + tabId).classList.add('active');
            
            // Update Judul
            const titles = { 'dash': 'Dashboard', 'books': 'Naskah', 'finance': 'Keuangan' };
            document.getElementById('title-text').innerText = titles[tabId];

            // Simpan tab ke memori agar kalau di-refresh tidak balik ke awal
            localStorage.setItem('nara_tab', tabId);
        }

        function logout() {
            localStorage.clear();
            location.reload();
        }
    </script>
</body>
</html>
