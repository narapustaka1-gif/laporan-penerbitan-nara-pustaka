<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Laporan Nara Pustaka</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>.hidden { display: none; }</style>
</head>
<body class="bg-gray-100 font-sans">

    <div id="login-section" class="min-h-screen flex items-center justify-center">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-96 border-b-8 border-blue-600">
            <h1 class="text-2xl font-bold text-center text-gray-800 mb-6">Nara Pustaka Login</h1>
            <input type="text" id="username" placeholder="Username" class="w-full p-3 mb-4 border rounded-lg outline-blue-500">
            <input type="password" id="password" placeholder="Kata Sandi" class="w-full p-3 mb-6 border rounded-lg outline-blue-500">
            <button onclick="login()" class="w-full bg-blue-600 text-white p-3 rounded-lg font-bold hover:bg-blue-700 transition">MASUK</button>
        </div>
    </div>

    <div id="dashboard" class="hidden min-h-screen flex flex-col">
        <nav class="bg-slate-900 text-white p-4 flex justify-between shadow-md">
            <span class="font-bold tracking-tighter italic text-xl">NARA PUSTAKA</span>
            <div class="flex items-center gap-4 text-sm">
                <span id="user-display" class="bg-blue-500 px-3 py-1 rounded-full"></span>
                <button onclick="location.reload()" class="bg-red-500 px-3 py-1 rounded">Logout</button>
            </div>
        </nav>

        <main class="p-6 max-w-7xl mx-auto w-full space-y-6">
            
            <div id="chart-section" class="hidden grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="bg-white p-6 rounded-xl shadow border">
                    <h3 class="font-bold mb-4 flex justify-between">
                        Statistik Penjualan
                        <button onclick="exportPDF('Grafik Penjualan')" class="text-xs bg-gray-200 px-2 py-1 rounded hover:bg-gray-300 font-bold">PDF</button>
                    </h3>
                    <canvas id="salesChart"></canvas>
                </div>
                <div class="bg-white p-6 rounded-xl shadow border">
                    <h3 class="font-bold mb-4 flex justify-between">
                        Statistik Penerbitan
                        <button onclick="exportPDF('Grafik Penerbitan')" class="text-xs bg-gray-200 px-2 py-1 rounded hover:bg-gray-300 font-bold">PDF</button>
                    </h3>
                    <canvas id="prodChart"></canvas>
                </div>
            </div>

            <div id="input-container" class="grid grid-cols-1 md:grid-cols-2 gap-6 italic">
                <div id="input-thami" class="hidden bg-white p-6 rounded-xl shadow border-l-4 border-green-500">
                    <h3 class="font-bold text-green-700 mb-4 tracking-wider underline">Input Penjualan (Admin)</h3>
                    <div class="space-y-3">
                        <input type="text" placeholder="Nama Pembeli" class="w-full p-2 border rounded text-sm">
                        <input type="text" placeholder="Judul Buku" class="w-full p-2 border rounded text-sm">
                        <div class="flex gap-2">
                            <input type="number" placeholder="Jumlah" class="w-1/3 p-2 border rounded text-sm">
                            <input type="number" placeholder="Harga" class="w-2/3 p-2 border rounded text-sm">
                        </div>
                        <input type="file" title="Bukti TF" class="text-xs w-full">
                        <button class="w-full bg-green-600 text-white p-2 rounded-lg font-bold">Submit Penjualan</button>
                    </div>
                </div>

                <div id="input-elyna" class="hidden bg-white p-6 rounded-xl shadow border-l-4 border-purple-500">
                    <h3 class="font-bold text-purple-700 mb-4 underline">Laporan Penulis (Redaksi)</h3>
                    <div class="space-y-3 text-sm italic">
                        <input type="text" placeholder="Nama Penulis" class="w-full p-2 border rounded">
                        <input type="text" placeholder="Judul Buku" class="w-full p-2 border rounded">
                        <input type="number" placeholder="Royalti (Rp)" class="w-full p-2 border rounded">
                        <button class="w-full bg-purple-600 text-white p-2 rounded-lg font-bold italic">Simpan Data Penulis</button>
                    </div>
                </div>
            </div>

            <div id="history-section" class="bg-white p-6 rounded-xl shadow overflow-x-auto">
                <h3 class="font-bold border-b pb-2 mb-4 italic uppercase text-gray-600">Riwayat Laporan & Data</h3>
                <table class="w-full text-left text-xs italic">
                    <tr class="bg-slate-100">
                        <th class="p-3">Tanggal</th><th class="p-3">Judul/Karya</th><th class="p-3">Personel</th><th class="p-3">Status</th>
                    </tr>
                    <tr class="border-b">
                        <td class="p-3 text-gray-500">11/05/2026</td><td class="p-3 font-bold">Naskah_Final_A.pdf</td><td class="p-3">Elyna</td><td class="p-3 text-blue-500 underline">Tinjau</td>
                    </tr>
                </table>
            </div>
        </main>
    </div>

    <script>
        const { jsPDF } = window.jspdf;

        function login() {
            const user = document.getElementById('username').value.toLowerCase();
            const pass = document.getElementById('password').value;

            // Logic SOP: Setiap orang punya sandi wajib
            const roles = {
                'vero': { p: 'vero_nara', show: ['chart-section', 'input-thami', 'input-elyna'], title: 'Manager (Vero)' },
                'jeyraa': { p: 'jeyraa_nara', show: ['chart-section', 'input-thami', 'input-elyna'], title: 'Team Leader (Jeyraa)' },
                'thami': { p: 'thami_nara', show: ['input-thami'], title: 'Admin (Thami)' },
                'elyna': { p: 'elyna_nara', show: ['input-elyna'], title: 'Redaksi (Elyna)' },
                'nala': { p: 'nala_nara', show: ['input-thami'], title: 'Desain (Nala)' }
            };

            if (roles[user] && roles[user].p === pass) {
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('dashboard').classList.remove('hidden');
                document.getElementById('user-display').innerText = roles[user].title;
                
                roles[user].show.forEach(id => document.getElementById(id).classList.remove('hidden'));
                
                // Load Grafik jika Vero atau Jeyraa
                if (user === 'vero' || user === 'jeyraa') initCharts();
            } else {
                alert('Kata sandi salah atau user tidak terdaftar!');
            }
        }

        function initCharts() {
            new Chart(document.getElementById('salesChart'), {
                type: 'bar',
                data: { labels: ['Jan', 'Feb', 'Mar', 'Apr'], datasets: [{ label: 'Omzet', data: [12, 19, 15, 25], backgroundColor: '#2563eb' }]}
            });
            new Chart(document.getElementById('prodChart'), {
                type: 'line',
                data: { labels: ['Jan', 'Feb', 'Mar', 'Apr'], datasets: [{ label: 'Buku Terbit', data: [3, 7, 4, 8], borderColor: '#db2777' }]}
            });
        }

        function exportPDF(title) {
            const doc = new jsPDF();
            doc.text("LAPORAN NARA PUSTAKA", 10, 10);
            doc.text("Kategori: " + title, 10, 20);
            doc.text("Tanggal Cetak: " + new Date().toLocaleDateString(), 10, 30);
            doc.text("Status: Verified by System", 10, 40);
            doc.save("Laporan_Nara_" + title + ".pdf");
        }
    </script>
</body>
</html>
