<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nara Pustaka Management System v2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#F8FAFC]">
    <div id="root"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, collection, onSnapshot, deleteDoc, query, orderBy, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";

        // Fallback config untuk testing jika global config tidak ada
        const firebaseConfig = JSON.parse(typeof __firebase_config !== 'undefined' ? __firebase_config : '{}');
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'nara-pustaka-enterprise';

        window.FirebaseCore = { 
            initializeApp, getAuth, signInAnonymously, onAuthStateChanged, 
            getFirestore, doc, setDoc, collection, onSnapshot, deleteDoc, query, orderBy, updateDoc, serverTimestamp,
            firebaseConfig, appId
        };
    </script>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const USERS = [
            { id: 'admin', name: 'Thami', role: 'Administrasi', password: 'admin123', color: 'bg-blue-600' },
            { id: 'editor', name: 'Elyna', role: 'Redaksi', password: 'editor123', color: 'bg-green-600' },
            { id: 'kreatif_calista', name: 'Calista', role: 'Kreatif (Ilustrator)', password: 'kreatif123', color: 'bg-purple-600' },
            { id: 'kreatif_zahra', name: 'Zahra', role: 'Kreatif (Ilustrator)', password: 'zahra123', color: 'bg-pink-600' },
            { id: 'sosmed_nala', name: 'Nala', role: 'Desain Grafis Sosmed', password: 'nala123', color: 'bg-indigo-600' },
            { id: 'leader', name: 'Jeyraa', role: 'Team Leader', password: 'leader123', color: 'bg-orange-600' },
            { id: 'manager', name: 'Vero', role: 'Manager/Keuangan', password: 'vero123', color: 'bg-red-600' }
        ];

        function App() {
            const { initializeApp, getAuth, signInAnonymously, onAuthStateChanged, getFirestore, doc, setDoc, collection, onSnapshot, deleteDoc, query, orderBy, updateDoc, serverTimestamp, firebaseConfig, appId } = window.FirebaseCore;
            
            const [userAuth, setUserAuth] = useState(null);
            const [currentUser, setCurrentUser] = useState(null);
            const [password, setPassword] = useState('');
            const [selectedUser, setSelectedUser] = useState(USERS[0]);
            const [isLoading, setIsLoading] = useState(true);
            const [kpis, setKpis] = useState([]);

            const db = getFirestore(initializeApp(firebaseConfig));
            const auth = getAuth();

            useEffect(() => {
                signInAnonymously(auth).catch(console.error);
                const saved = localStorage.getItem('nara_pustaka_session');
                if (saved) {
                    const found = USERS.find(u => u.id === saved);
                    if (found) setCurrentUser(found);
                }
                setIsLoading(false);
                return onAuthStateChanged(auth, u => setUserAuth(u));
            }, []);

            useEffect(() => {
                if (!userAuth) return;
                const kpiRef = collection(db, 'artifacts', appId, 'public', 'data', 'kpis');
                const q = query(kpiRef, orderBy('createdAt', 'desc'));
                
                return onSnapshot(q, s => {
                    setKpis(s.docs.map(d => ({id: d.id, ...d.data()})));
                });
            }, [userAuth]);

            const handleLogin = (e) => {
                e.preventDefault();
                if (password === selectedUser.password) {
                    setCurrentUser(selectedUser);
                    localStorage.setItem('nara_pustaka_session', selectedUser.id);
                } else {
                    alert("Password Salah!");
                }
            };

            const handleLogout = () => {
                setCurrentUser(null);
                localStorage.removeItem('nara_pustaka_session');
            };

            const updateKpiProgress = async (id, val, target) => {
                if (val < 0 || val > target + 10) return; // Limitasi input liar
                await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'kpis', id), { current: val });
            };

            const addKpi = async (uId, title, target) => {
                if (!title || !target) return alert("Data tidak lengkap!");
                const userObj = USERS.find(u => u.id === uId);
                const id = Date.now().toString();
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'kpis', id), {
                    id, userId: uId, userName: userObj.name, title, 
                    target: parseInt(target), current: 0, unit: 'Tugas Harian',
                    createdAt: serverTimestamp()
                });
            };

            const deleteKpi = async (id) => {
                if (confirm("Hapus tugas KPI ini?")) {
                    await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'kpis', id));
                }
            };

            if (isLoading) return <div className="h-screen flex items-center justify-center font-black text-slate-300 animate-pulse">LOADING NARA SYSTEM...</div>;

            if (!currentUser) return (
                <div className="min-h-screen flex items-center justify-center p-6 bg-slate-100">
                    <div className="bg-white p-10 rounded-[2.5rem] shadow-2xl w-full max-w-md">
                        <div className="text-center mb-10">
                            <h1 className="text-4xl font-black italic tracking-tighter text-slate-900">NARA</h1>
                            <div className="h-1 w-12 bg-slate-900 mx-auto mt-1"></div>
                        </div>
                        <form onSubmit={handleLogin} className="space-y-5">
                            <div>
                                <label className="text-[10px] font-black text-slate-400 uppercase ml-2">Identitas</label>
                                <select className="w-full p-4 rounded-2xl bg-slate-50 border-2 border-slate-100 font-bold" value={selectedUser.id} onChange={e => setSelectedUser(USERS.find(u => u.id === e.target.value))}>
                                    {USERS.map(u => <option key={u.id} value={u.id}>{u.name} - {u.role}</option>)}
                                </select>
                            </div>
                            <div>
                                <label className="text-[10px] font-black text-slate-400 uppercase ml-2">Sandi</label>
                                <input type="password" placeholder="••••" className="w-full p-4 rounded-2xl bg-slate-50 border-2 border-slate-100 font-bold text-center" value={password} onChange={e => setPassword(e.target.value)}/>
                            </div>
                            <button className="w-full bg-slate-900 text-white p-5 rounded-2xl font-black hover:scale-[1.02] transition-all shadow-lg shadow-slate-200">MASUK DASHBOARD</button>
                        </form>
                    </div>
                </div>
            );

            return (
                <div className="max-w-6xl mx-auto p-4 md:p-10">
                    {/* Header */}
                    <div className="flex justify-between items-center bg-white p-6 rounded-[2rem] border border-slate-100 shadow-sm mb-10">
                        <div className="flex items-center gap-4">
                            <div className={`w-14 h-14 rounded-2xl ${currentUser.color} flex items-center justify-center text-white font-black text-2xl shadow-lg`}>{currentUser.name[0]}</div>
                            <div>
                                <h2 className="font-black text-xl text-slate-900">{currentUser.name}</h2>
                                <p className="text-xs font-bold text-slate-400 uppercase tracking-widest">{currentUser.role}</p>
                            </div>
                        </div>
                        <button onClick={handleLogout} className="bg-red-50 text-red-500 font-black px-6 py-3 rounded-xl hover:bg-red-500 hover:text-white transition-all text-xs uppercase">Logout</button>
                    </div>

                    <div className="grid grid-cols-1 gap-10">
                        {/* KPI Display Section */}
                        <section>
                            <h3 className="text-sm font-black text-slate-400 uppercase tracking-[0.3em] mb-6 flex items-center gap-2">
                                <span className="w-2 h-2 bg-blue-500 rounded-full"></span> My Progress
                            </h3>
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                {kpis.filter(k => k.userId === currentUser.id).map(k => (
                                    <div key={k.id} className="bg-white p-6 rounded-[2rem] border border-slate-100 shadow-sm relative group">
                                        <div className="flex justify-between items-start mb-4">
                                            <div>
                                                <p className="font-black text-slate-900 text-lg">{k.title}</p>
                                                <p className="text-[10px] font-bold text-slate-400 uppercase">Target: {k.target}</p>
                                            </div>
                                            <span className="text-xs bg-slate-900 text-white px-3 py-1 rounded-lg font-black">{Math.round((k.current/k.target)*100)}%</span>
                                        </div>
                                        <div className="w-full bg-slate-100 h-4 rounded-full mb-6 overflow-hidden shadow-inner">
                                            <div className="bg-slate-900 h-full rounded-full transition-all duration-1000" style={{width: `${Math.min(100, (k.current/k.target)*100)}%`}}></div>
                                        </div>
                                        <div className="flex justify-between items-center">
                                            <span className="font-black text-2xl text-slate-800">{k.current}</span>
                                            <div className="flex gap-2">
                                                <button onClick={() => updateKpiProgress(k.id, k.current - 1, k.target)} className="bg-slate-100 w-12 h-12 rounded-xl font-black hover:bg-slate-200">-</button>
                                                <button onClick={() => updateKpiProgress(k.id, k.current + 1, k.target)} className="bg-slate-900 text-white w-12 h-12 rounded-xl font-black hover:shadow-lg">+</button>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </section>

                        {/* Admin/Manager Panel */}
                        {currentUser.id === 'manager' && (
                            <section className="bg-slate-900 p-8 rounded-[2.5rem] text-white shadow-2xl">
                                <h2 className="text-2xl font-black mb-8 italic">Assign Team KPI</h2>
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
                                    <select id="kpi-user" className="bg-slate-800 border-none p-4 rounded-2xl font-bold focus:ring-2 ring-blue-500 outline-none">
                                        {USERS.map(u => <option key={u.id} value={u.id}>{u.name}</option>)}
                                    </select>
                                    <input id="kpi-title" placeholder="Nama Tugas..." className="bg-slate-800 border-none p-4 rounded-2xl font-bold focus:ring-2 ring-blue-500 outline-none"/>
                                    <input id="kpi-target" type="number" placeholder="Angka Target" className="bg-slate-800 border-none p-4 rounded-2xl font-bold focus:ring-2 ring-blue-500 outline-none"/>
                                </div>
                                <button onClick={() => {
                                    const uId = document.getElementById('kpi-user').value;
                                    const title = document.getElementById('kpi-title').value;
                                    const target = document.getElementById('kpi-target').value;
                                    addKpi(uId, title, target);
                                    document.getElementById('kpi-title').value = "";
                                    document.getElementById('kpi-target').value = "";
                                }} className="w-full bg-blue-600 hover:bg-blue-500 p-5 rounded-2xl font-black transition-all">PUBLISH TARGET KE TIM</button>
                            </section>
                        )}

                        {/* Leader Monitoring */}
                        {(currentUser.id === 'leader' || currentUser.id === 'manager') && (
                            <section className="bg-white p-8 rounded-[2.5rem] border border-slate-100 shadow-sm">
                                <h2 className="text-xl font-black text-slate-900 mb-6 flex items-center gap-2">
                                    <span className="w-2 h-2 bg-orange-500 rounded-full"></span> Team Fleet Monitor
                                </h2>
                                <div className="space-y-3">
                                    {kpis.map(k => (
                                        <div key={k.id} className="flex items-center justify-between p-5 bg-slate-50 rounded-2xl border border-slate-100 group">
                                            <div className="flex items-center gap-4">
                                                <div className="w-10 h-10 rounded-lg bg-white flex items-center justify-center font-black text-slate-400 border text-xs">{k.userName[0]}</div>
                                                <div>
                                                    <p className="font-black text-slate-900 text-sm">{k.userName}</p>
                                                    <p className="text-[10px] font-bold text-slate-400 uppercase">{k.title}</p>
                                                </div>
                                            </div>
                                            <div className="flex items-center gap-6">
                                                <div className="text-right hidden md:block">
                                                    <p className="font-black text-slate-900">{Math.round((k.current/k.target)*100)}%</p>
                                                    <p className="text-[10px] font-bold text-slate-400 uppercase">{k.current} / {k.target}</p>
                                                </div>
                                                {currentUser.id === 'manager' && (
                                                    <button onClick={() => deleteKpi(k.id)} className="text-slate-300 hover:text-red-500 p-2 transition-all">
                                                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                                                    </button>
                                                )}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </section>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
