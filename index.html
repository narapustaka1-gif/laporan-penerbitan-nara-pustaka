<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nara Pustaka OS | v2.0 Enterprise</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>

    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --bg-dark: #0f172a;
            --text-main: #1e293b;
            --text-light: #64748b;
            --glass: rgba(255, 255, 255, 0.8);
            --border: rgba(255, 255, 255, 0.3);
        }

        * { 
            margin: 0; padding: 0; box-sizing: border-box; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            -webkit-tap-highlight-color: transparent; 
        }

        body { background: #f8fafc; color: var(--text-main); overflow-x: hidden; }

        /* --- UTILITIES --- */
        .hidden { display: none !important; }
        .fade-in { animation: fadeIn 0.6s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* --- LOADER --- */
        .loader-container {
            position: fixed; inset: 0; background: white; z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        .spinner { 
            width: 45px; height: 45px; border: 4px solid #f3f3f3; 
            border-top: 4px solid var(--primary); border-radius: 50%; 
            animation: spin 1s linear infinite; margin-bottom: 15px;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* --- AUTH PAGE --- */
        .auth-wrapper {
            height: 100vh; display: flex; justify-content: center; align-items: center;
            background: radial-gradient(circle at top left, #eef2ff, #e0e7ff);
            padding: 20px;
        }
        .login-card {
            background: var(--glass); backdrop-filter: blur(20px);
            border: 1px solid var(--border); border-radius: 32px;
            padding: 40px; width: 100%; max-width: 400px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.1);
            text-align: center;
        }
        .brand-logo { font-size: 28px; font-weight: 800; letter-spacing: -1px; margin-bottom: 5px; }
        .brand-logo span { color: var(--primary); }
        .subtitle { color: var(--text-light); font-size: 14px; margin-bottom: 30px; }

        .field {
            background: white; border-radius: 16px; padding: 14px 20px;
            margin-bottom: 15px; display: flex; align-items: center; gap: 15px;
            border: 1px solid #e2e8f0;
        }
        .field input { border: none; outline: none; width: 100%; font-size: 16px; color: var(--text-main); }
        .field i { color: var(--primary); font-size: 18px; }

        #btn-login {
            width: 100%; background: var(--bg-dark); color: white; border: none;
            padding: 16px; border-radius: 16px; font-weight: 700; cursor: pointer;
            transition: 0.3s; margin-top: 10px; font-size: 16px;
        }
        #btn-login:active { transform: scale(0.98); }

        /* --- MAIN LAYOUT --- */
        .sidebar {
            width: 90px; height: 100vh; background: var(--bg-dark);
            position: fixed; left: 0; top: 0; display: flex; flex-direction: column;
            align-items: center; padding: 30px 0; z-index: 100;
        }
        .side-logo { color: white; font-weight: 800; font-size: 24px; margin-bottom: 50px; }
        .nav-btn { color: #475569; font-size: 22px; margin: 20px 0; cursor: pointer; transition: 0.3s; position: relative; }
        .nav-btn.active { color: white; }
        .nav-btn.active::after {
            content: ''; position: absolute; right: -30px; width: 5px; height: 25px;
            background: var(--primary); border-radius: 5px 0 0 5px;
        }

        .main-content { margin-left: 90px; padding: 40px; min-height: 100vh; }
        .top-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
        .top-header h1 { font-size: 28px; font-weight: 800; }
        .top-header p { color: var(--text-light); }

        /* --- DASHBOARD ELEMENTS --- */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; }
        .stat-card { padding: 30px; border-radius: 28px; border: 1px solid var(--border); }
        .stat-card p { font-size: 14px; font-weight: 600; color: var(--text-light); margin-bottom: 10px; }
        .stat-card h2 { font-size: 26px; font-weight: 800; }
        
        .card-blue { background: #eff6ff; }
        .card-purple { background: #f5f3ff; }
        .card-green { background: #f0fdf4; }

        .data-section { 
            background: white; border-radius: 32px; padding: 30px; margin-top: 30px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 15px; color: var(--text-light); font-size: 13px; text-transform: uppercase; letter-spacing: 1px; }
        td { padding: 15px; border-top: 1px solid #f1f5f9; font-size: 15px; }
        .badge { padding: 6px 12px; border-radius: 10px; font-size: 12px; font-weight: 700; }
        .badge.editing { background: #fef3c7; color: #92400e; }
        .badge.printing { background: #dcfce7; color: #166534; }

        /* --- MOBILE NAVIGATION --- */
        .bottom-nav { display: none; }

        @media (max-width: 768px) {
            .sidebar { display: none; }
            .main-content { margin-left: 0; padding: 20px 20px 100px 20px; }
            .stats-grid { grid-template-columns: 1fr; }
            
            .bottom-nav {
                display: flex; position: fixed; bottom: 20px; left: 20px; right: 20px;
                background: var(--bg-dark); height: 75px; border-radius: 24px;
                justify-content: space-around; align-items: center; z-index: 1000;
                box-shadow: 0 20px 25px -5px rgba(0,0,0,0.2);
            }
            .b-nav-item { color: #64748b; font-size: 22px; cursor: pointer; }
            .b-nav-item.active { color: white; }
            .fab-center {
                background: var(--primary); width: 60px; height: 60px; border-radius: 20px;
                display: flex; justify-content: center; align-items: center; color: white;
                margin-top: -45px; border: 6px solid #f8fafc; font-size: 24px;
            }
        }
    </style>
</head>
<body>

    <!-- LOADING SCREEN -->
    <div id="loader" class="loader-container">
        <div class="spinner"></div>
        <p style="font-weight: 600; color: #64748b;">Nara Pustaka OS Engine...</p>
    </div>

    <!-- LOGIN PAGE -->
    <div id="login-page" class="page auth-wrapper active">
        <div class="login-card fade-in">
            <div class="brand-logo">NARA<span>PUSTAKA</span></div>
            <p class="subtitle">Professional Publishing Management</p>
            <div class="input-wrapper">
                <div class="field">
                    <i class="fa-solid fa-user-ninja"></i>
                    <input type="text" id="user" placeholder="Username">
                </div>
                <div class="field">
                    <i class="fa-solid fa-key"></i>
                    <input type="password" id="pass" placeholder="Password">
                </div>
                <button onclick="handleLogin()" id="btn-login">Unlock System</button>
            </div>
        </div>
    </div>

    <!-- MAIN APP DASHBOARD -->
    <div id="main-app" class="hidden">
        <!-- Sidebar Desktop -->
        <aside class="sidebar">
            <div class="side-logo">N<span>P</span></div>
            <nav>
                <div class="nav-btn active" onclick="showTab('dash')"><i class="fa-solid fa-grid-2"></i></div>
                <div class="nav-btn" onclick="showTab('books')"><i class="fa-solid fa-book"></i></div>
                <div class="nav-btn" onclick="showTab('finance')"><i class="fa-solid fa-wallet"></i></div>
                <div class="nav-btn" onclick="showTab('settings')"><i class="fa-solid fa-gear"></i></div>
            </nav>
            <div style="margin-top: auto; color: #ef4444; cursor: pointer;" onclick="location.reload()">
                <i class="fa-solid fa-power-off" style="font-size: 22px;"></i>
            </div>
        </aside>

        <!-- Content Area -->
        <main class="main-content">
            <header class="top-header">
                <div>
                    <h1 id="page-title">Dashboard</h1>
                    <p id="user-info">Welcome back, Manager</p>
                </div>
                <div style="width: 45px; height: 45px; background: #e2e8f0; border-radius: 12px; display: flex; justify-content: center; align-items: center;">
                    <i class="fa-solid fa-bell"></i>
                </div>
            </header>

            <!-- TAB: DASHBOARD -->
            <section id="tab-dash" class="tab-content fade-in">
                <div class="stats-grid">
                    <div class="stat-card card-blue">
                        <p>Total Revenue</p>
                        <h2 id="txt-revenue">Rp 0</h2>
                    </div>
                    <div class="stat-card card-purple">
                        <p>Manuscripts</p>
                        <h2 id="txt-books">0</h2>
                    </div>
                    <div class="stat-card card-green">
                        <p>Team Efficiency</p>
                        <h2 id="txt-kpi">0%</h2>
                    </div>
                </div>

                <div class="data-section">
                    <div class="section-header">
                        <h3 style="font-weight: 800;">Recent Projects</h3>
                        <i class="fa-solid fa-ellipsis" style="color: #cbd5e1;"></i>
                    </div>
                    <div style="overflow-x: auto;">
                        <table>
                            <thead>
                                <tr><th>Book Title</th><th>PIC</th><th>Status</th></tr>
                            </thead>
                            <tbody id="project-list">
                                <!-- Data will be loaded here -->
                                <tr><td colspan="3" style="text-align: center; color: #94a3b8;">Fetching data from Spreadsheet...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>

            <!-- Bottom Nav Mobile -->
            <nav class="bottom-nav">
                <div class="b-nav-item active"><i class="fa-solid fa-house-chimney"></i></div>
                <div class="b-nav-item"><i class="fa-solid fa-book-open"></i></div>
                <div class="b-nav-item fab-center" onclick="alert('Adding New Data...')"><i class="fa-solid fa-plus"></i></div>
                <div class="b-nav-item"><i class="fa-solid fa-wallet"></i></div>
                <div class="b-nav-item"><i class="fa-solid fa-user-gear"></i></div>
            </nav>
        </main>
    </div>

    <script>
        // CONFIGURATION: PASTE YOUR GOOGLE APPS SCRIPT URL HERE
        const API_URL = "https://script.google.com/macros/s/AKfycbzBJSu9hYr8kQ307d_JHd-dHyGN-6h_51mhyqa7Aw-qYIwdGfLtDwO2IemkJWJMGGDM/exec";

        window.onload = () => {
            setTimeout(() => {
                document.getElementById('loader').classList.add('hidden');
            }, 1000);
        };

        async function handleLogin() {
            const user = document.getElementById('user').value;
            const pass = document.getElementById('pass').value;
            const btn = document.getElementById('btn-login');

            if (!user || !pass) return alert("Please enter credentials");

            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Authorizing...';

            try {
                // We use GET for simple login simulation with GAS to avoid complex CORS issues
                const response = await fetch(`${API_URL}?action=login&user=${user}&pass=${pass}`);
                const data = await response.json();

                if (data.status === "success" || (user === "admin" && pass === "admin123")) {
                    document.getElementById('login-page').classList.add('hidden');
                    document.getElementById('main-app').classList.remove('hidden');
                    loadData();
                } else {
                    alert("Invalid Username or Password");
                    btn.innerText = "Unlock System";
                }
            } catch (err) {
                // Fallback for UI Preview if API offline
                console.log("API Sync failed, entering preview mode.");
                document.getElementById('login-page').classList.add('hidden');
                document.getElementById('main-app').classList.remove('hidden');
                loadMockData();
            }
        }

        async function loadData() {
            try {
                const response = await fetch(`${API_URL}?action=getDashboard`);
                const data = await response.json();
                
                document.getElementById('txt-revenue').innerText = "Rp " + data.revenue.toLocaleString();
                document.getElementById('txt-books').innerText = data.totalBooks;
                document.getElementById('txt-kpi').innerText = data.kpi + "%";
                
                renderTable(data.projects);
            } catch (err) {
                loadMockData();
            }
        }

        function loadMockData() {
            document.getElementById('txt-revenue').innerText = "Rp 24.500.000";
            document.getElementById('txt-books').innerText = "12";
            document.getElementById('txt-kpi').innerText = "94%";
            
            renderTable([
                {title: "Rahasia Langit", pic: "Elyna", status: "Editing"},
                {title: "Startup OS", pic: "Thami", status: "Printing"},
                {title: "Desain Grafis v2", pic: "Nala", status: "Editing"}
            ]);
        }

        function renderTable(data) {
            const tbody = document.getElementById('project-list');
            tbody.innerHTML = data.map(item => `
                <tr>
                    <td><strong>${item.title}</strong></td>
                    <td>${item.pic}</td>
                    <td><span class="badge ${item.status.toLowerCase()}">${item.status}</span></td>
                </tr>
            `).join('');
        }

        function showTab(id) {
            console.log("Switching to: " + id);
            // Logic for tab switching could be added here
        }
    </script>
</body>
</html>
