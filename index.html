<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nara Pustaka Operasional</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/js/all.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    *{scroll-behavior:smooth}
    body{
      font-family:Inter,sans-serif;
      background:linear-gradient(135deg,#dbeafe,#fce7f3,#dcfce7,#fef3c7);
      min-height:100vh;
      overflow-x:hidden;
      color:#1e293b;
    }

    .glass{
      background:rgba(255,255,255,.55);
      backdrop-filter:blur(14px);
      border:1px solid rgba(255,255,255,.4);
      box-shadow:0 8px 32px rgba(0,0,0,.3);
    }

    .fade-in{
      animation:fade .5s ease;
    }

    @keyframes fade{
      from{opacity:0;transform:translateY(10px)}
      to{opacity:1;transform:translateY(0)}
    }

    .bottom-nav{
      position:fixed;
      bottom:0;
      left:0;
      right:0;
      z-index:999;
    }

    .loader{
      position:fixed;
      inset:0;
      background:linear-gradient(135deg,#bfdbfe,#fbcfe8,#bbf7d0);
      display:flex;
      justify-content:center;
      align-items:center;
      z-index:99999;
    }

    .spin{
      width:70px;
      height:70px;
      border:6px solid rgba(255,255,255,.1);
      border-top:6px solid #38bdf8;
      border-radius:50%;
      animation:spin 1s linear infinite;
    }

    @keyframes spin{
      to{transform:rotate(360deg)}
    }

    .hidden-scroll::-webkit-scrollbar{
      display:none;
    }
  </style>
</head>
<body>

<div id="loader" class="loader">
  <div class="text-center">
    <div class="spin mx-auto"></div>
    <p class="mt-4 text-sky-300 text-xl font-bold">Nara Pustaka</p>
  </div>
</div>

<div id="toast" class="fixed top-5 right-5 hidden z-[9999] px-5 py-3 rounded-2xl glass text-white"></div>

<div id="app"></div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzU6OXHUHXHUPeSD9560gUy5F-XAdegvadeQOhq3e0I2Z5rZmny9ww_JY5qGtLiz2Y/exec";

const USERS = [
  {username:'vero',password:'vero123',role:'Manager',fullname:'Vero'},
  {username:'jeyraa',password:'jey123',role:'Team Leader',fullname:'Jeyraa'},
  {username:'thami',password:'thami123',role:'Administrasi',fullname:'Thami'},
  {username:'elyna',password:'ely123',role:'Redaksi',fullname:'Elyna'},
  {username:'nala',password:'nala123',role:'Desain',fullname:'Nala'},
  {username:'calista',password:'calista123',role:'Kreatif',fullname:'Calista'},
  {username:'zahra',password:'zahra123',role:'Kreatif',fullname:'Zahra'}
];

let salesData = JSON.parse(localStorage.getItem('salesData')) || [];
let projectsData = JSON.parse(localStorage.getItem('projectsData')) || [];

setTimeout(()=>{
  document.getElementById('loader').style.display='none';
  checkSession();
},1200);

function saveData(){
  localStorage.setItem('salesData',JSON.stringify(salesData));
  localStorage.setItem('projectsData',JSON.stringify(projectsData));
}

function toast(msg){
  const t=document.getElementById('toast');
  t.innerHTML=msg;
  t.classList.remove('hidden');

  setTimeout(()=>{
    t.classList.add('hidden');
  },2500);
}

function checkSession(){
  const user = JSON.parse(localStorage.getItem('naraUser'));

  if(user){
    renderDashboard(user);
  }else{
    renderLogin();
  }
}

function renderLogin(){
  document.getElementById('app').innerHTML=`

  <div class="min-h-screen flex items-center justify-center p-5 fade-in">

    <div class="glass w-full max-w-md p-6 rounded-3xl">

      <div class="text-center mb-8">
        <h1 class="text-4xl font-black text-sky-300">Nara Pustaka</h1>
        <p class="text-slate-300 mt-2">Sistem Operasional Penerbit</p>
      </div>

      <div class="space-y-4">
        <input id="username" type="text" placeholder="Username"
        class="w-full p-4 rounded-2xl bg-white/10 border border-white/10 outline-none">

        <input id="password" type="password" placeholder="Password"
        class="w-full p-4 rounded-2xl bg-white/10 border border-white/10 outline-none">

        <button onclick="login()"
        class="w-full bg-sky-500 hover:bg-sky-600 transition p-4 rounded-2xl font-bold">
          Login
        </button>
      </div>

    </div>
  </div>
  `;
}

function login(){
  const u=document.getElementById('username').value;
  const p=document.getElementById('password').value;

  const found=USERS.find(x=>x.username===u && x.password===p);

  if(found){
    localStorage.setItem('naraUser',JSON.stringify(found));
    toast('Login berhasil');
    renderDashboard(found);
  }else{
    toast('Username/password salah');
  }
}

function logout(){
  localStorage.removeItem('naraUser');
  renderLogin();
}

function renderDashboard(user){

  let content='';

  if(user.role==='Manager') content=managerDashboard(user);
  else if(user.role==='Administrasi') content=adminDashboard(user);
  else if(user.role==='Redaksi') content=redaksiDashboard(user);
  else content=staffDashboard(user);

  document.getElementById('app').innerHTML=content;

  if(user.role==='Manager') initCharts();
}

function totalIncome(){
  return salesData.reduce((a,b)=>a+Number(b.total||0),0);
}

function totalRoyalty(){
  return salesData.reduce((a,b)=>a+Number(b.royalty||0),0);
}

function managerDashboard(user){

  const income=totalIncome();
  const royalty=totalRoyalty();
  const expense=500000;
  const gross=income-expense;
  const net=gross-royalty;

  return `

  <div class="pb-28 p-4 fade-in">

    <div class="flex justify-between items-center mb-5">
      <div>
        <h1 class="text-3xl font-black text-sky-300">Manager</h1>
        <p class="text-slate-300">Halo ${user.fullname}</p>
      </div>

      <button onclick="logout()"
      class="bg-red-500 px-4 py-2 rounded-xl">
        Logout
      </button>
    </div>

    <div class="grid grid-cols-2 gap-4">

      ${card('Total Pemasukan','Rp '+income.toLocaleString(),'fa-wallet')}
      ${card('Pengeluaran','Rp '+expense.toLocaleString(),'fa-money-bill')}
      ${card('Laba Kotor','Rp '+gross.toLocaleString(),'fa-chart-line')}
      ${card('Laba Bersih','Rp '+net.toLocaleString(),'fa-coins')}
      ${card('Royalti','Rp '+royalty.toLocaleString(),'fa-crown')}
      ${card('Penjualan',salesData.length,'fa-cart-shopping')}

    </div>

    <div class="glass rounded-3xl p-5 mt-5">
      <div class="flex justify-between items-center mb-4">
        <h2 class="font-bold text-xl">Grafik Penjualan</h2>
      </div>
      <canvas id="salesChart"></canvas>
    </div>

    <div class="glass rounded-3xl p-5 mt-5">
      <h2 class="font-bold text-xl mb-4">Grafik Laba</h2>
      <canvas id="profitChart"></canvas>
    </div>

    <div class="glass rounded-3xl p-5 mt-5 overflow-auto hidden-scroll">

      <div class="flex justify-between items-center mb-4">
        <h2 class="font-bold text-xl">Laporan</h2>
      </div>

      <div class="space-y-3">

        <button onclick="exportManagerPDF()"
        class="w-full bg-sky-500 p-4 rounded-2xl font-bold">
        Export PDF Manager
        </button>

        <button onclick="exportTaxPDF()"
        class="w-full bg-emerald-500 p-4 rounded-2xl font-bold">
        Export PDF Pajak
        </button>

        <button onclick="exportRoyaltyPDF()"
        class="w-full bg-purple-500 p-4 rounded-2xl font-bold">
        Export Royalti
        </button>

      </div>

    </div>

    ${bottomNav()}

  </div>
  `;
}

      <input type="file"
      class="w-full p-4 rounded-2xl bg-white/10 border border-white/10">

      <input type="file"
      class="w-full p-4 rounded-2xl bg-white/10 border border-white/10">

      <div class="grid grid-cols-2 gap-3">

        <button onclick="saveSale('${user.fullname}')"

    <div class="mt-5 space-y-3">

      <div class="glass rounded-3xl p-5 mb-5 shadow-xl">

        <div class="space-y-4">

            Simpan Pengeluaran
          </button>
        </div>
      </div>

      ${salesData.map((s,i)=>`

        <div class="flex justify-between">
          <div>
            <h3 class="font-bold">${s.book}</h3>
            <p class="text-sm text-slate-300">${s.buyer}</p>
          </div>

          class="bg-red-500 px-3 py-1 rounded-xl">
            <i class="fa fa-trash"></i>
          </button>
        </div>
      </div>
      `).join('')}

    </div>

    ${bottomNav()}

  </div>
  `;
}

function card(title,value,icon){
  return `
  <div class="glass rounded-3xl p-4">
    <div class="flex justify-between items-center">
      <div>
        <p class="text-slate-300 text-sm">${title}</p>

      </div>

      <div class="text-3xl text-sky-300">
        <i class="fa ${icon}"></i>
      </div>
    </div>
  </div>
  `;
}

function bottomNav(){
  return `

  <div class="bottom-nav px-4 pb-4">

    <div class="glass rounded-3xl p-4 flex justify-around items-center">

      <button onclick="checkSession()">
        <i class="fa fa-house text-xl"></i>
      </button>

      <button onclick="toast('Dashboard aktif')">
        <i class="fa fa-chart-simple text-xl"></i>
      </button>

      <button onclick="window.scrollTo({top:0,behavior:'smooth'})"
      class="bg-sky-500 w-14 h-14 rounded-full -mt-10 shadow-2xl">
        <i class="fa fa-plus"></i>
      </button>

      <button onclick="toast('Laporan siap')">

      </button>

  </div>
  `;
}

function calculateTotal(){
  const qty=Number(document.getElementById('qty').value || 0);

  const total=qty*85000;
  const royalty=total*0.1;

  document.getElementById('total').value='Rp '+total.toLocaleString();
  document.getElementById('royalty').value='Rp '+royalty.toLocaleString();
}

async function saveSale(user){

  const sale={
    id:Date.now(),
    buyer:document.getElementById('buyer').value,
    book:document.getElementById('book').value,
    qty:document.getElementById('qty').value,
    marketplace:document.getElementById('marketplace').value,
    total:Number(document.getElementById('qty').value||0)*85000,
    royalty:Number(document.getElementById('qty').value||0)*8500,
    user:user,
    date:new Date().toLocaleDateString()
  };

  salesData.unshift(sale);
  saveData();

  try{
    await fetch(API_URL,{
      method:'POST',
      body:JSON.stringify({
        action:'addSale',
        data:sale
      })
    });
  }catch(err){
    console.log(err);
  }

  toast('Penjualan berhasil disimpan');

  const current=JSON.parse(localStorage.getItem('naraUser'));
  renderDashboard(current);
}

function deleteSale(i){
  if(confirm('Hapus data?')){
    salesData.splice(i,1);
    saveData();

    const current=JSON.parse(localStorage.getItem('naraUser'));
    renderDashboard(current);

    toast('Data dihapus');
  }
}

function clearSales(){
  if(confirm('Hapus semua data penjualan?')){
    salesData=[];
    saveData();

    const current=JSON.parse(localStorage.getItem('naraUser'));
    renderDashboard(current);
  }
}

function saveProject(){

  const data={
    title:document.getElementById('title').value,
    author:document.getElementById('author').value,
    isbn:document.getElementById('isbn').value,
    price:document.getElementById('price').value,
    percent:document.getElementById('percent').value,
    editor:document.getElementById('editor').value,
    layout:document.getElementById('layout').value,
    cover:document.getElementById('cover').value,
    status:document.getElementById('status').value
  };

  projectsData.unshift(data);
  saveData();

  toast('Proyek berhasil disimpan');

  const current=JSON.parse(localStorage.getItem('naraUser'));
  renderDashboard(current);
}

function initCharts(){

  const salesCtx=document.getElementById('salesChart');
  if(salesCtx){

    new Chart(salesCtx,{
      type:'line',
      data:{
        labels:['Jan','Feb','Mar','Apr','Mei','Jun'],
        datasets:[{
          label:'Penjualan',
          data:[12,19,8,14,20,30],
          borderColor:'#38bdf8',
          backgroundColor:'rgba(56,189,248,.2)',
          tension:.4,
          fill:true
        }]
      }
    });
  }

  const profitCtx=document.getElementById('profitChart');

  if(profitCtx){

    new Chart(profitCtx,{
      type:'bar',
      data:{
        labels:['Jan','Feb','Mar','Apr','Mei'],
        datasets:[{
          label:'Laba',
          data:[3,4,5,7,8],
          backgroundColor:'rgba(16,185,129,.7)'
        }]
      }
    });
  }
}

function exportManagerPDF(){

  const {jsPDF}=window.jspdf;
  const doc=new jsPDF();

  doc.setFontSize(20);
  doc.text('Nara Pustaka',20,20);

  doc.setFontSize(12);
  doc.text('Laporan Manager',20,30);

  doc.text('Tanggal: '+new Date().toLocaleDateString(),20,40);

  doc.text('Total Pemasukan: Rp '+totalIncome().toLocaleString(),20,60);
  doc.text('Total Royalti: Rp '+totalRoyalty().toLocaleString(),20,70);
  doc.text('Total Penjualan: '+salesData.length,20,80);

  doc.text('Tanda Tangan',140,240);
  doc.text('Vero',150,255);

  doc.save('laporan-manager.pdf');

  toast('PDF Manager berhasil dibuat');
}

function exportTaxPDF(){

  const {jsPDF}=window.jspdf;
  const doc=new jsPDF();

  doc.setFontSize(20);
  doc.text('Nara Pustaka',20,20);

  doc.text('Laporan Pajak',20,35);

  doc.text('Estimasi Pajak: Rp '+(totalIncome()*0.11).toLocaleString(),20,60);

  doc.text('Disetujui Vero',140,250);

  doc.save('laporan-pajak.pdf');

  toast('PDF Pajak berhasil dibuat');
}

function exportRoyaltyPDF(){

  const {jsPDF}=window.jspdf;
  const doc=new jsPDF();

  doc.setFontSize(20);
  doc.text('Laporan Royalti Penulis',20,20);

  let y=40;

  salesData.forEach((s,index)=>{
    doc.text(`${index+1}. ${s.book} - ${s.buyer} - Rp ${s.royalty.toLocaleString()}`,20,y);
    y+=10;
  });

  doc.text('Dicetak oleh Vero',20,260);

  doc.save('laporan-royalti.pdf');

  toast('PDF Royalti berhasil dibuat');
}

</script>
