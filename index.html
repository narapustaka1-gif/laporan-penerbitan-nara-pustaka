<div id="app"></div>

<script>

const API_URL = 'https://script.google.com/macros/s/AKfycbznZWEypHjDOe3GoyVCIHFl6fjKL4KJ6MepgAGfFEjXI-bKRGu8AIyuaSBSQzGd9WbqWw/exec';

// Database Akun Internal Perusahaan
const USERS = [
    {username:'vero',password:'vero123',role:'Manager',fullname:'Deby Verona'},
    {username:'jeyraa',password:'jey123',role:'Team Leader',fullname:'Jeyraa'},
    {username:'thami',password:'thami123',role:'Administrasi',fullname:'Thami'},
    {username:'elyna',password:'ely123',role:'Redaksi',fullname:'Elyna'},
    {username:'nala',password:'nala123',role:'Desain',fullname:'Nala'},
    {username:'calista',password:'calista123',role:'Kreatif',fullname:'Calista'},

function init() {
    const user = JSON.parse(localStorage.getItem('naraUser'));

    } else {

}

function toast(msg) {
    const div = document.createElement('div');
    div.className = 'fixed top-5 left-1/2 -translate-x-1/2 bg-[#064E3B] text-white px-6 py-3 rounded-xl shadow-xl z-50 font-medium text-sm border border-emerald-500 fade';
    div.innerText = msg;
    document.body.appendChild(div);
    setTimeout(() => div.remove(), 2500);
}

function loginPage() {
    document.getElementById('app').innerHTML = `

            <div class="p-8 pb-4 text-center">
                <div class="flex justify-center mb-5">
                    <div class="w-12 h-12 bg-[#064E3B] transform -skew-x-12 rounded-xl flex items-center justify-center shadow-md">

                    </div>
                </div>

                        <input id="username" type="text" placeholder="Masukkan username" class="w-full pl-11 pr-4 py-3.5 text-sm rounded-xl border border-gray-200 focus:outline-none focus:border-[#064E3B] bg-gray-50/30 font-medium">
                    </div>

            </div>

            <div class="p-8 pt-6 space-y-6">
                <button onclick="login()" class="w-full bg-[#064E3B] hover:bg-[#043E2F] text-white py-3.5 rounded-xl font-semibold text-sm tracking-wide transition shadow-lg cursor-pointer flex items-center justify-center space-x-2">
                    <span>Masuk Aplikasi</span>
                    <i class="fa fa-arrow-right text-xs opacity-80"></i>
                </button>
                <div class="text-center border-t border-gray-100 pt-4">

            </div>
        </div>
    </div>`;
}

async function login() {
    const u = document.getElementById('username').value.trim();
    const p = document.getElementById('password').value.trim();
    const found = USERS.find(x => x.username === u && x.password === p);
    if (!found) { toast('Login gagal! Akun tidak valid.'); return; }
    localStorage.setItem('naraUser', JSON.stringify(found));
    await loadAllData(found);
}

function logout() {
    localStorage.removeItem('naraUser');
    loginPage();
}

async function loadAllData(user) {
    document.getElementById('app').innerHTML = `
    <div class="min-h-screen flex items-center justify-center">
        <div class="text-center space-y-3">
            <div class="w-12 h-12 border-4 border-[#064E3B] border-t-transparent rounded-full animate-spin mx-auto"></div>
            <div class="text-sm font-bold text-[#064E3B]">Mengamankan Jalur Data Cloud...</div>
        </div>
    </div>`;

    try {
        const [b, s, p, e, a] = await Promise.all([
            fetch(API_URL + '?action=getBooks').then(r => r.json().catch(()=>[])),
            fetch(API_URL + '?action=getSales').then(r => r.json().catch(()=>[])),
            fetch(API_URL + '?action=getProjects').then(r => r.json().catch(()=>[])),
            fetch(API_URL + '?action=getExpenses').then(r => r.json().catch(()=>[])),
            fetch(API_URL + '?action=getAttendance').then(r => r.json().catch(()=>[])) // Tarik data absensi cloud asli
        ]);

        books = b; sales = s; projects = p; expenses = e; attendanceLog = a;
        renderResponsiveDashboard(user);
    } catch (err) {
        console.error(err);
        toast('Gagal memproses jembatan API!');
    }
}

function renderResponsiveDashboard(user) {

                    <button onclick="handleAttendance('Masuk')" class="flex-1 md:flex-none bg-[#064E3B] text-white px-5 py-2.5 rounded-xl text-xs font-bold hover:bg-[#043E2F] transition cursor-pointer"><i class="fa fa-sign-in-alt mr-1.5"></i> Clock In</button>
                    <button onclick="handleAttendance('Pulang')" class="flex-1 md:flex-none bg-orange-600 text-white px-5 py-2.5 rounded-xl text-xs font-bold hover:bg-orange-700 transition cursor-pointer"><i class="fa fa-sign-out-alt mr-1.5"></i> Clock Out</button>
                </div>

        <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-gray-100 p-4 flex justify-around items-center z-40 shadow-lg">

/* ==============================================
   LOGIKA SISTEM PRESENSI CLOUD (TIDAK FIKTIF)
   ============================================== */
async function handleAttendance(type) {
    const user = JSON.parse(localStorage.getItem('naraUser'));
    const now = new Date();
    const dateStr = now.toLocaleDateString('id-ID');
    const timeStr = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });

    toast(`Mengirim presensi ${type} ke server cloud...`);
    
    try {
        await fetch(API_URL, {
            method: 'POST',
            body: JSON.stringify({
                action: 'addAttendance',
                data: {
                    name: user.fullname,
                    role: user.role,
                    date: dateStr,
                    time: timeStr,
                    type: type
                }
            })
        });
        toast(`Presensi ${type} berhasil terverifikasi pada ${timeStr}!`);
        loadAllData(user);
    } catch(err) {
        toast('Gagal terhubung ke server cloud. Presensi dibatalkan.');
    }
}

function renderManagerChart() {
    setTimeout(() => {
        const ctx = document.getElementById('salesChart');
        if(!ctx) return;
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: sales.map(x => x.book || 'N/A'),
                datasets: [{ label: 'Total Penjualan Kotor (Rp)', data: sales.map(x => x.total || 0), backgroundColor: '#064E3B', borderRadius: 4 }]
            },
            options: { responsive: true, maintainAspectRatio: false }
        });
    }, 150);
}

/* ==============================================
   LOGIKA PERHITUNGAN TRANSAKSI & INPUT DATA
   ============================================== */

function calculateTotal() {
    const title = document.getElementById('book').value;
    const book = books.find(x => x.title === title);
    const qty = Number(document.getElementById('qty').value || 0);
    if (!book) return;
    const total = qty * Number(book.price || 0);
    const royal = total * (Number(book.royalty_percent || 0) / 100);
    document.getElementById('total').value = 'Rp ' + total.toLocaleString();
    document.getElementById('royaltyAmount').value = 'Rp ' + royal.toLocaleString();
}

async function saveSale(user) {
    const title = document.getElementById('book').value;
    const book = books.find(x => x.title === title);
    if (!book) { toast('Harap pilih judul buku!'); return; }
    const qty = Number(document.getElementById('qty').value || 0);
    if (qty <= 0) { toast('Kuantitas minimal 1 unit!'); return; }
    
    const total = qty * Number(book.price || 0);
    const royal = total * (Number(book.royalty_percent || 0) / 100);

    toast('Mengunggah berkas penjualan...');
    await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({
            action: 'addSale',
            data: {
                id: Date.now(),
                date: new Date().toLocaleDateString(),
                buyer_name: document.getElementById('buyer').value || '-',
                book: title,
                author: book.author || '-',
                qty: qty,
                total: total,
                royalty: royal,
                marketplace: document.getElementById('marketplace').value || '-',
                payment_status: 'Paid',
                invoice_file: document.getElementById('invoiceFile').files[0]?.name || '-',
                payment_file: document.getElementById('paymentFile').files[0]?.name || '-',
                user: user
            }
        })
    });

    toast('Data penjualan berhasil disimpan!');
    loadAllData(JSON.parse(localStorage.getItem('naraUser')));
}

async function saveExpense(user) {
    const desc = document.getElementById('expenseDescription').value.trim();
    const amount = Number(document.getElementById('expenseAmount').value || 0);
    if(!desc || amount <= 0) { toast('Isi keterangan & nominal dengan benar!'); return; }
    
    toast('Mengunggah rincian pengeluaran...');
    await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({
            action: 'addExpense',
            data: {
                id: Date.now(),
                description: desc,
                category: 'Percetakan',
                vendor: document.getElementById('vendor').value || '-',
                amount: amount,
                receipt_file: document.getElementById('expenseInvoice').files[0]?.name || '-',
                date: new Date().toLocaleDateString(),
                user: user
            }
        })
    });

    toast('Data operasional berhasil disimpan!');
    loadAllData(JSON.parse(localStorage.getItem('naraUser')));
}

async function saveProject() {
    const titleVal = document.getElementById('title').value.trim();
    if(!titleVal) { toast('Judul buku wajib diisi!'); return; }

    const data = {
        projectId: Date.now(),
        title: titleVal,
        author: document.getElementById('author').value || '-',
        status: document.getElementById('status').value,
        redaksi: 'Elyna',
        editor: document.getElementById('editor').value || '-',
        layout: document.getElementById('layout').value || '-',
        cover: document.getElementById('cover').value || '-'
    };

    toast('Mendaftarkan judul naskah...');
    await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'addProject', data: data }) });
    await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({
            action: 'addBook',
            data: {
                id: 'BK' + Date.now(),
                title: data.title,
                author: data.author,
                isbn: document.getElementById('isbn').value || '-',
                price: document.getElementById('price').value || 0,
                royalty_percent: document.getElementById('royalty').value || 0,
                status: data.status
            }
        })
    });

    toast('Buku resmi didaftarkan ke sistem!');
    loadAllData(JSON.parse(localStorage.getItem('naraUser')));
}

async function deleteData(sheet, id) {
    if (!confirm('Hapus baris data terpilih secara permanen?')) return;

    toast('Menghapus data dari server...');
    await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({
            action: 'deleteRow',
            data: { sheet: sheet, id: id }
        })
    });

    toast('Data berhasil dihapus!');
    loadAllData(JSON.parse(localStorage.getItem('naraUser')));
}

/* ==============================================
   PROSEDUR RENDER LOGO VECTOR RESMI NARA PUSTAKA
   ============================================== */
function drawNaraLogo(doc, x, y) {
    doc.setFillColor(139, 90, 43); // Cokelat Utama Nara
    doc.rect(x, y + 2, 4, 18, 'F');
    doc.rect(x + 14, y + 5, 4, 15, 'F');
    
    for(let i=0; i<=10; i++) {
        let pct = i / 10;
        let arcY = y + 5 - Math.sin(pct * Math.PI) * 3;
        doc.rect(x + 4 + (pct * 10), arcY, 1.5, 5, 'F');
    }
    
    doc.setFillColor(219, 194, 161); // Krem Sekunder Logo
    doc.circle(x + 2, y + 18, 3, 'F');
    doc.setFillColor(139, 90, 43);
    doc.circle(x + 2, y + 18, 1.2, 'F');
}

/* ==============================================
   PROSEDUR RENDER TANDA TANGAN DEBY VERONA (VEKTOR)
   ============================================== */
function drawDebySignature(doc, x, y) {
    doc.setDrawColor(40, 40, 40);
    doc.setLineWidth(0.6);
    
    doc.ellipse(x + 12, y + 2, 12, 3, 'D');
    doc.line(x + 18, y + 4, x + 16, y + 8);
    doc.line(x + 16, y + 8, x + 20, y + 10);
    doc.line(x + 20, y + 10, x + 15, y + 13);
    doc.line(x + 15, y + 13, x + 19, y + 16);
    doc.ellipse(x + 10, y + 17, 10, 2, 'D');
    
    for (let theta = 0; theta <= Math.PI; theta += 0.1) {
        let xStart = x + 13 - Math.cos(theta) * 11;
        let yStart = y + 28 - Math.sin(theta) * 10;
        let xEnd = x + 13 - Math.cos(theta + 0.1) * 11;
        let yEnd = y + 28 - Math.sin(theta + 0.1) * 10;
        if(theta + 0.1 <= Math.PI) doc.line(xStart, yStart, xEnd, yEnd);
    }
    doc.line(x + 2, y + 28, x + 26, y + 28);
    doc.line(x + 23, y + 25, x + 25, y + 29);
}
